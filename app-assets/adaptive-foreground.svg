<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
  <defs>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="100%" stop-color="#d8deea"/>
    </linearGradient>
  </defs>

  <!--
    Android adaptive-icon safe zone: content must fit within the inner
    66/108 dp circle => diameter 264px centered at (216,216). Transparent
    outside the artwork; the background color shows there.
  -->

  <!-- Film strip (scaled to fit safe zone) -->
  <g>
    <rect x="141" y="66 " width="150" height="276" rx="10" fill="url(#strip)" stroke="#8a96a4" stroke-width="1.5"/>

    <!-- Sprocket holes left -->
    <g fill="#1a2434">
      <rect x="147" y="80" width="7" height="5" rx="1.5"/>
      <rect x="147" y="112" width="7" height="5" rx="1.5"/>
      <rect x="147" y="144" width="7" height="5" rx="1.5"/>
      <rect x="147" y="176" width="7" height="5" rx="1.5"/>
      <rect x="147" y="208" width="7" height="5" rx="1.5"/>
      <rect x="147" y="240" width="7" height="5" rx="1.5"/>
    </g>
    <!-- Sprocket holes right -->
    <g fill="#1a2434">
      <rect x="278" y="80" width="7" height="5" rx="1.5"/>
      <rect x="278" y="112" width="7" height="5" rx="1.5"/>
      <rect x="278" y="144" width="7" height="5" rx="1.5"/>
      <rect x="278" y="176" width="7" height="5" rx="1.5"/>
      <rect x="278" y="208" width="7" height="5" rx="1.5"/>
      <rect x="278" y="240" width="7" height="5" rx="1.5"/>
    </g>

    <!-- Four shots -->
    <g>
      <rect x="160" y="80" width="112" height="44" rx="3" fill="#ec407a"/>
      <circle cx="183" cy="102" r="9" fill="#f8bbd0" opacity="0.85"/>
      <rect x="160" y="129" width="112" height="44" rx="3" fill="#1e88e5"/>
      <rect x="170" y="141" width="28" height="16" rx="2" fill="#bbdefb" opacity="0.85"/>
      <rect x="160" y="178" width="112" height="44" rx="3" fill="#f9a825"/>
      <circle cx="183" cy="200" r="8" fill="#fff176" opacity="0.9"/>
      <rect x="160" y="227" width="112" height="44" rx="3" fill="#8e24aa"/>
      <circle cx="183" cy="249" r="8" fill="#e1bee7" opacity="0.85"/>
    </g>
  </g>

  <!-- Brand (strictly inside safe circle) -->
  <g>
    <text x="216" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#f2f5fa" text-anchor="middle">FotoMat</text>
    <text x="216" y="378" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#5a9ed8" text-anchor="middle" letter-spacing="5">2000</text>
  </g>
</svg>